name: Daily Release

on:
  schedule:
    # 每天 00:00 UTC（北京时间 08:00）自动检查；有新的打包内容且当日未发版时自动递增版本号发版（08:15 由 store-index 自动采集）。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish a new patch release even without new package changes"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: plugin-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release-notes
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan version and package plugin
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          FORCE: ${{ inputs.force == true && 'true' || 'false' }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync, spawnSync } from 'node:child_process';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const CHINESE = /[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\ufe10-\ufe1f\ufe30-\ufe4f\uff00-\uffef\u{20000}-\u{2ffff}\u{30000}-\u{323af}]/u;
          const HAN = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\u{20000}-\u{2ffff}\u{30000}-\u{323af}]/u;
          const EMOJI = /[©®‼⁉™ℹ↔-↙↩↪⌚-⌛⌨⏏⏩-⏳⏸-⏺Ⓜ▪▫▶◀◻-◾\u2600-\u27bf⤴⤵⬅-⬇⬛⬜⭐⭕〰〽㊗㊙\u20e3\ufe00-\ufe0f\u{1f000}-\u{1faff}]/u;
          const MAX_README_BYTES = 512 * 1024;

          function requireCond(condition, message) {
            if (!condition) {
              throw new Error(message);
            }
          }

          function sh(cmd, args, opts = {}) {
            return execFileSync(cmd, args, { encoding: 'utf8', ...opts }).trim();
          }

          function succeeds(cmd, args) {
            return spawnSync(cmd, args, { stdio: 'ignore' }).status === 0;
          }

          function summary(msg) {
            console.log(msg);
            const sPath = process.env.GITHUB_STEP_SUMMARY;
            if (sPath) {
              fs.appendFileSync(sPath, `${msg}\n`, 'utf8');
            }
          }

          function setOutput(outputs) {
            const oPath = process.env.GITHUB_OUTPUT;
            if (oPath) {
              const lines = Object.entries(outputs).map(([k, v]) => `${k}=${v}\n`).join('');
              fs.appendFileSync(oPath, lines, 'utf8');
            }
          }

          function checkText(value, locale, context) {
            if (typeof value === 'string') {
              requireCond(!EMOJI.test(value), `${context}: emoji in ${JSON.stringify(value)}`);
              if (locale.toLowerCase().startsWith('en')) {
                requireCond(!CHINESE.test(value), `${context}: Chinese text in ${JSON.stringify(value)}`);
              }
            } else if (Array.isArray(value)) {
              value.forEach((child, index) => checkText(child, locale, `${context}[${index}]`));
            } else if (value && typeof value === 'object') {
              for (const [key, child] of Object.entries(value)) {
                checkText(key, 'zh', `${context}.<key>`);
                checkText(child, locale, `${context}.${key}`);
              }
            }
          }

          function checkContributesEn(value, context = 'manifest.contributes') {
            if (Array.isArray(value)) {
              value.forEach((child, index) => checkContributesEn(child, `${context}[${index}]`));
            } else if (value && typeof value === 'object') {
              for (const [key, child] of Object.entries(value)) {
                if (key === 'en') {
                  checkText(child, 'en', `${context}.en`);
                } else {
                  checkContributesEn(child, `${context}.${key}`);
                }
              }
            }
          }

          function declaredSurfaces(manifest) {
            const surfaces = [...(manifest.surfaces || [])];
            const contributes = manifest.contributes || {};
            for (const sec of contributes.settings_sections || []) {
              surfaces.push(`settings_section:${sec.id}`);
            }
            for (const panel of contributes.panels || []) {
              surfaces.push(`panel:${panel.id}`);
            }
            for (const dialog of contributes.dialogs || []) {
              surfaces.push(`dialog:${dialog.id}`);
            }
            requireCond(surfaces.length > 0, 'manifest must declare at least one surface');
            return [...new Set(surfaces)];
          }

          function checkNoSymlinksTree(pkgDir) {
            const rootStat = fs.lstatSync(pkgDir);
            requireCond(!rootStat.isSymbolicLink() && rootStat.isDirectory(), `Release package dir must be a non-symlink directory: ${pkgDir}`);
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir)) {
                const fullPath = path.join(dir, entry);
                const st = fs.lstatSync(fullPath);
                requireCond(!st.isSymbolicLink(), `Symlink is not allowed in release package: ${path.relative(pkgDir, fullPath)}`);
                if (st.isDirectory()) {
                  walk(fullPath);
                }
              }
            };
            walk(pkgDir);
          }

          function stripHtmlComments(text) {
            return text.replace(/<!--[\s\S]*?-->/g, '').replace(/<!--[\s\S]*$/, '').trim();
          }

          function readStrictReadme(pkgDir, filename) {
            const filePath = path.join(pkgDir, filename);
            const st = fs.lstatSync(filePath, { throwIfNoEntry: false });
            requireCond(st && !st.isSymbolicLink() && st.isFile(), `${filename} must be a non-symlink regular file`);
            const raw = fs.readFileSync(filePath);
            requireCond(raw.length <= MAX_README_BYTES, `${filename} exceeds ${MAX_README_BYTES} bytes`);
            let text;
            try {
              text = new TextDecoder('utf-8', { fatal: true }).decode(raw);
            } catch (err) {
              throw new Error(`${filename} must be valid UTF-8: ${err.message}`);
            }
            text = text.replace(/^\ufeff/, '').trim();
            requireCond(Boolean(text), `${filename} must not be empty`);
            return text;
          }

          function resolveEntryJS(pkgDir, manifest) {
            const entry = manifest.entry;
            requireCond(entry && typeof entry === 'object' && !Array.isArray(entry), 'manifest.entry must be an object');
            const jsRel = entry.js;
            requireCond(typeof jsRel === 'string' && jsRel.length > 0 && jsRel === jsRel.trim(), 'manifest.entry.js must be a non-empty relative path');
            requireCond(!jsRel.startsWith('/') && !jsRel.includes('\\') && !jsRel.includes(':'), `Invalid manifest.entry.js: ${JSON.stringify(jsRel)}`);
            const parts = jsRel.split('/');
            requireCond(!parts.includes('..') && !parts.includes('.') && parts.every((p) => p.length > 0), `manifest.entry.js must be a clean relative path: ${JSON.stringify(jsRel)}`);
            requireCond(jsRel.endsWith('.js') || jsRel.endsWith('.mjs'), `manifest.entry.js must end with .js or .mjs: ${JSON.stringify(jsRel)}`);
            const target = path.join(pkgDir, ...parts);
            const st = fs.lstatSync(target, { throwIfNoEntry: false });
            requireCond(st && !st.isSymbolicLink() && st.isFile(), `manifest.entry.js must be a non-symlink regular file: ${jsRel}`);
            return target;
          }

          function checkJsSyntax(pkgDir) {
            const tmpDir = fs.mkdtempSync(path.join(os.tmpdir(), 'block-js-syntax-'));
            try {
              let idx = 0;
              const walk = (dir) => {
                for (const name of fs.readdirSync(dir).sort()) {
                  const fullPath = path.join(dir, name);
                  const st = fs.lstatSync(fullPath);
                  if (st.isDirectory()) {
                    walk(fullPath);
                  } else if (st.isFile()) {
                    requireCond(!name.endsWith('.py'), `Unexpected Python file in JS plugin package: ${path.relative(pkgDir, fullPath)}`);
                    if (name.endsWith('.js') || name.endsWith('.mjs')) {
                      idx += 1;
                      const checkPath = path.join(tmpDir, `check-${idx}.mjs`);
                      fs.copyFileSync(fullPath, checkPath);
                      execFileSync(process.execPath, ['--check', checkPath], { stdio: 'pipe' });
                    }
                  }
                }
              };
              walk(pkgDir);
            } finally {
              fs.rmSync(tmpDir, { recursive: true, force: true });
            }
          }

          function collectControls(page) {
            const map = new Map();
            const walk = (items) => {
              for (const item of items || []) {
                if (item.kind === 'group') {
                  walk(item.fields);
                } else if (item.id) {
                  map.set(item.id, item);
                }
              }
            };
            for (const card of page.cards || []) {
              walk(card.items);
            }
            return map;
          }

          function cartesian(lists) {
            return lists.reduce(
              (acc, cur) => acc.flatMap((prev) => cur.map((val) => [...prev, val])),
              [[]],
            );
          }

          async function runJsSmokeLocale(pkgDir, entryRel, locale, pluginId, surfaces) {
            const tmpDir = fs.mkdtempSync(path.join(os.tmpdir(), `block-image-host-${locale}-`));
            const pluginSandbox = path.join(tmpDir, 'plugin');
            fs.mkdirSync(pluginSandbox, { recursive: true });
            const nbA = path.join(tmpDir, 'Notebook A');
            const nbB = path.join(tmpDir, 'Notebook B');
            const notebooks = [nbA, nbB];
            for (const nb of notebooks) {
              fs.mkdirSync(nb, { recursive: true });
              for (let i = 0; i < 8; i += 1) {
                fs.writeFileSync(path.join(nb, `photo-${i}.png`), 'fixture');
              }
            }
            const dropImg = path.join(tmpDir, 'drop.png');
            fs.writeFileSync(dropImg, 'drop-fixture');

            try {
              const copyTree = (srcDir, dstDir) => {
                for (const name of fs.readdirSync(srcDir)) {
                  const src = path.join(srcDir, name);
                  const dst = path.join(dstDir, name);
                  const st = fs.lstatSync(src);
                  if (st.isDirectory()) {
                    fs.mkdirSync(dst, { recursive: true });
                    copyTree(src, dst);
                  } else if (st.isFile() && (name.endsWith('.js') || name.endsWith('.mjs'))) {
                    const raw = fs.readFileSync(src, 'utf8');
                    const rewritten = raw.replace(/(['"])\/runtime\/block-sdk\.js\1/g, "'./block-sdk.mjs'");
                    fs.writeFileSync(dst, rewritten, 'utf8');
                  }
                }
              };
              copyTree(pkgDir, pluginSandbox);
              fs.writeFileSync(path.join(pluginSandbox, 'package.json'), '{"type":"module"}\n', 'utf8');

              const entrySource = fs.readFileSync(path.join(pkgDir, entryRel), 'utf8');
              requireCond(
                entrySource.includes("'/runtime/block-sdk.js'") || entrySource.includes('"/runtime/block-sdk.js"'),
                'entry.js must import /runtime/block-sdk.js',
              );

              const sdkMock = `
                import crypto from 'node:crypto';
                import fs from 'node:fs';
                import path from 'node:path';

                export const state = {
                  notebooks: ${JSON.stringify(notebooks)},
                  storage: {
                    logs: [{
                      title: '连接测试（S3 兼容）',
                      status: '未连通',
                      time: '12:00',
                      tooltip: '图床服务端返回 HTTP 403，请核对凭证、区域或存储桶权限',
                    }],
                  },
                  notes: {
                    'first.md': ${JSON.stringify(Array.from({ length: 8 }, (_, i) => `![Photo](photo-${i}.png)`).join(' '))},
                    'second.md': '![Shared photo](photo-0.png)',
                  },
                  httpCalls: [],
                  progress: [],
                  toasts: [],
                  menubar: null,
                  handler: null,
                };
                export function serve(handler) {
                  state.handler = handler;
                }
                export function notifyHost(method, params = {}) {
                  if (method === 'host.action.progress') {
                    state.progress.push(params);
                  }
                }
                export function callHost(method, params = {}) {
                  if (method === 'host.notebooks.list') {
                    return {
                      notebooks: state.notebooks.map((p, i) => ({
                        path: p,
                        name: path.basename(p),
                        active: i === 0,
                      })),
                    };
                  }
                  if (method === 'host.storage.get') {
                    if (params.key) {
                      const has = Object.prototype.hasOwnProperty.call(state.storage, params.key);
                      return { found: has, value: has ? state.storage[params.key] : null };
                    }
                    return { data: state.storage };
                  }
                  if (method === 'host.storage.set') {
                    state.storage[params.key] = params.value;
                    return { ok: true };
                  }
                  if (method === 'host.notes.list') {
                    return { notes: Object.keys(state.notes).map((p) => ({ path: p })) };
                  }
                  if (method === 'host.notes.read') {
                    return { content: state.notes[params.path], revision: 'fixture-1' };
                  }
                  if (method === 'host.notes.write') {
                    state.notes[params.path] = params.content;
                    return { ok: true };
                  }
                  if (method === 'host.fs.stat') {
                    try {
                      const st = fs.lstatSync(params.path);
                      const isSymlink = st.isSymbolicLink();
                      const isDir = st.isDirectory() && !isSymlink;
                      const isRegular = st.isFile() && !isSymlink;
                      return {
                        exists: true,
                        path: params.path,
                        name: path.basename(params.path),
                        is_dir: isDir,
                        is_regular: isRegular,
                        is_symlink: isSymlink,
                        size: st.size,
                        mod_time: new Date(st.mtimeMs).toISOString(),
                        mod_time_ms: Math.round(st.mtimeMs),
                        is_icloud_placeholder: false,
                      };
                    } catch {
                      return { exists: false };
                    }
                  }
                  if (method === 'host.fs.read') {
                    const buf = fs.readFileSync(params.path);
                    if (params.encoding === 'base64') {
                      return {
                        path: params.path,
                        encoding: 'base64',
                        content_base64: buf.toString('base64'),
                        size: buf.length,
                      };
                    }
                    return {
                      path: params.path,
                      encoding: 'utf8',
                      content: buf.toString('utf8'),
                      size: buf.length,
                    };
                  }
                  if (method === 'host.crypto.hash') {
                    const h = crypto.createHash(params.algorithm);
                    if (params.file_path) h.update(fs.readFileSync(params.file_path));
                    else if (params.base64 !== undefined) h.update(Buffer.from(params.base64, 'base64'));
                    else h.update(Buffer.from(params.text ?? '', 'utf8'));
                    const dig = h.digest();
                    return { hex: dig.toString('hex'), base64: dig.toString('base64') };
                  }
                  if (method === 'host.crypto.hmac') {
                    const key = params.key_base64 !== undefined
                      ? Buffer.from(params.key_base64, 'base64')
                      : Buffer.from(params.key_text ?? '', 'utf8');
                    const data = params.data_base64 !== undefined
                      ? Buffer.from(params.data_base64, 'base64')
                      : Buffer.from(params.data_text ?? '', 'utf8');
                    const dig = crypto.createHmac(params.algorithm, key).update(data).digest();
                    return { hex: dig.toString('hex'), base64: dig.toString('base64') };
                  }
                  if (method === 'host.http.request') {
                    state.httpCalls.push({ method: params.method, url: params.url, body: params.body || '' });
                    if (String(params.url).includes('api.github.com')) {
                      if (params.method === 'GET' && String(params.url).includes('/contents/')) {
                        return { status: 404, headers: {}, body: '{"message":"Not Found"}', bytes: 23, final_url: params.url };
                      }
                      return { status: 200, headers: {}, body: '{"permissions":{"push":true},"size":1,"default_branch":"main"}', bytes: 60, final_url: params.url };
                    }
                    return { status: 200, headers: {}, body: '', bytes: 0, final_url: params.url };
                  }
                  if (method === 'host.ui.toast') {
                    state.toasts.push(params);
                    return { ok: true, shown: true };
                  }
                  if (method === 'host.ui.open_settings') {
                    return { ok: true };
                  }
                  if (method === 'host.menubar.set') {
                    state.menubar = params;
                    return { ok: true };
                  }
                  throw new Error('Unexpected host request: ' + method);
                }
              `;
              fs.writeFileSync(path.join(pluginSandbox, 'block-sdk.mjs'), sdkMock, 'utf8');

              const sdk = await import(pathToFileURL(path.join(pluginSandbox, 'block-sdk.mjs')).href);
              await import(pathToFileURL(path.join(pluginSandbox, entryRel)).href);
              const handler = sdk.state.handler;
              requireCond(typeof handler === 'function', `${locale}: serve(handler) was not called`);

              const rpc = (method, params = {}) => handler(method, params);
              const init = rpc('plugin.initialize', {
                plugin_id: pluginId,
                locale,
                data_dir: path.join(tmpDir, 'Data'),
                downloads_dir: path.join(tmpDir, 'Downloads'),
                notebook_root: nbA,
                notebooks,
                ui_capabilities: ['checklist', 'multi_notebook', 'action_progress', 'toast_banner', 'open_settings'],
              });
              requireCond(init?.ready === true, `${locale}: plugin not ready`);

              const valid = {
                s3_endpoint: 'https://storage.example.com',
                s3_bucket: 'images',
                s3_access_key: 'fixture',
                s3_secret_key: 'fixture',
                public_domain: 'https://images.example.com',
                gh_repo: 'example/images',
                gh_token: 'fixture',
              };

              const pages = {};
              for (const surface of surfaces) {
                const initial = rpc('plugin.render', { surface, values: {} }).page;
                requireCond(typeof initial?.title === 'string' && initial.title.trim().length > 0, `${locale} ${surface}: missing page title`);
                checkText(initial, locale, `${locale} ${surface}`);
                pages[surface] = initial;

                const choices = {};
                for (const [controlId, item] of collectControls(initial).entries()) {
                  if (item.kind === 'segmented' || item.kind === 'select') {
                    choices[controlId] = item.options.map((o) => o.value);
                  } else if (item.kind === 'switch') {
                    choices[controlId] = [false, true];
                  }
                }
                const keys = Object.keys(choices);
                if (surface === 'settings_page') {
                  requireCond(keys.length > 0 && keys.every((k) => choices[k].length > 0), `${locale}: missing choice controls`);
                }
                let count = 0;
                if (keys.length > 0) {
                  for (const combo of cartesian(keys.map((k) => choices[k]))) {
                    const values = Object.fromEntries(keys.map((k, idx) => [k, combo[idx]]));
                    for (const scenario of [
                      { selected_notebooks: [] },
                      { selected_notebooks: notebooks },
                      { ...valid, selected_notebooks: notebooks },
                    ]) {
                      const page = rpc('plugin.render', { surface, values: { ...scenario, ...values } }).page;
                      checkText(page, locale, `${locale} ${surface} combo`);
                      const items = collectControls(page);
                      for (const [controlId, expected] of Object.entries(values)) {
                        requireCond(items.get(controlId)?.value === expected, `${locale} ${surface}: ${controlId} mismatch`);
                      }
                      count += 1;
                    }
                  }
                }
                console.log(`${locale} ${surface}: ${count + 1} renders passed`);
              }

              const saveRes = rpc('plugin.action', {
                action_id: 'save_config',
                values: { ...valid, provider: 'r2', selected_notebooks: [nbA] },
              });
              requireCond(saveRes?.ok === true, `${locale}: save_config failed`);
              checkText(saveRes, locale, `${locale} save_config`);

              const testRes = rpc('plugin.action', {
                action_id: 'test_conn',
                values: { ...valid, provider: 'r2', selected_notebooks: [nbA] },
              });
              requireCond(testRes?.ok === true, `${locale}: test_conn failed`);
              checkText(testRes, locale, `${locale} test_conn`);

              const cmdRes = rpc('plugin.command', {
                command_id: 'upload-dropped',
                context: { source: 'menubar_drop', files: [dropImg] },
              });
              requireCond(cmdRes?.ok === true && typeof cmdRes.copy_text === 'string', `${locale}: upload-dropped failed`);
              checkText(cmdRes.status, locale, `${locale} upload-dropped.status`);

              const evRes = rpc('plugin.event', {
                event: 'note.saved',
                notebook_root: nbA,
                path: 'second.md',
              });
              requireCond(evRes?.handled === true, `${locale}: note.saved failed`);

              const uploadRes = rpc('plugin.action', {
                action_id: 'upload_now',
                values: { ...valid, provider: 'r2', selected_notebooks: [nbA] },
              });
              requireCond(uploadRes?.ok === true, `${locale}: upload_now failed`);
              checkText(uploadRes, locale, `${locale} upload_now`);
              requireCond(
                String(sdk.state.notes['first.md'] || '').includes('https://images.example.com/'),
                `${locale}: upload_now did not rewrite note link`,
              );

              const ghSaveRes = rpc('plugin.action', {
                action_id: 'save_config',
                values: { ...valid, provider: 'github', gh_branch: 'feat/img', selected_notebooks: [nbA] },
              });
              requireCond(ghSaveRes?.ok === true, `${locale}: github save_config failed`);
              const ghCmdRes = rpc('plugin.command', {
                command_id: 'upload-dropped',
                context: { source: 'menubar_drop', files: [dropImg] },
              });
              requireCond(
                ghCmdRes?.ok === true && String(ghCmdRes.copy_text || '').includes('/feat/img/'),
                `${locale}: github upload-dropped failed`,
              );
              const ghPut = [...sdk.state.httpCalls].reverse().find(
                (c) => c.method === 'PUT' && String(c.url).includes('api.github.com'),
              );
              requireCond(
                ghPut && JSON.parse(ghPut.body || '{}').content === Buffer.from('drop-fixture').toString('base64'),
                `${locale}: github PUT content did not match base64 payload`,
              );

              const shut = rpc('plugin.shutdown');
              requireCond(shut?.ok === true, `${locale}: shutdown failed`);
              return pages;
            } finally {
              fs.rmSync(tmpDir, { recursive: true, force: true });
            }
          }

          async function validateStagedPackage(pkgDir) {
            checkNoSymlinksTree(pkgDir);
            checkJsSyntax(pkgDir);

            const manifestPath = path.join(pkgDir, 'manifest.json');
            const mStat = fs.lstatSync(manifestPath, { throwIfNoEntry: false });
            requireCond(mStat && !mStat.isSymbolicLink() && mStat.isFile(), 'Staged package missing manifest.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const pluginId = typeof manifest.id === 'string' ? manifest.id.trim() : '';
            requireCond(Boolean(pluginId), 'Missing manifest.id');
            requireCond(pluginId !== 'block-diagnostics', 'Reserved plugin id: block-diagnostics');

            for (const field of ['name', 'summary']) {
              const translations = manifest[field];
              requireCond(translations && typeof translations === 'object' && !Array.isArray(translations), `manifest.${field} must be an object`);
              for (const loc of ['zh', 'en']) {
                const value = translations[loc];
                requireCond(typeof value === 'string' && value.trim().length > 0, `Missing manifest.${field}.${loc}`);
                if (loc === 'en') {
                  requireCond(!CHINESE.test(value), `manifest.${field}.en: Chinese text in ${JSON.stringify(value)}`);
                }
              }
            }
            checkText(manifest, 'zh', 'manifest');
            checkContributesEn(manifest.contributes);

            const zhReadme = readStrictReadme(pkgDir, 'README.md');
            const enReadme = readStrictReadme(pkgDir, 'README.en.md');
            requireCond(HAN.test(stripHtmlComments(zhReadme)), 'README.md must contain visible Chinese text');
            requireCond(!CHINESE.test(enReadme), 'README.en.md must contain English-only text');
            requireCond(/[A-Za-z]/.test(stripHtmlComments(enReadme)), 'README.en.md must contain at least one visible ASCII letter');
            checkText(zhReadme, 'zh', 'README.md');
            checkText(enReadme, 'en', 'README.en.md');
            requireCond(zhReadme !== enReadme, 'The two README files must differ');

            const surfaces = declaredSurfaces(manifest);
            resolveEntryJS(pkgDir, manifest);
            const zhPages = await runJsSmokeLocale(pkgDir, manifest.entry.js, 'zh', pluginId, surfaces);
            const enPages = await runJsSmokeLocale(pkgDir, manifest.entry.js, 'en', pluginId, surfaces);
            for (const surface of surfaces) {
              requireCond(zhPages[surface].title !== enPages[surface].title, `${surface}: Chinese and English page titles must differ`);
              requireCond(JSON.stringify(zhPages[surface]) !== JSON.stringify(enPages[surface]), `${surface}: Chinese and English rendered pages must differ`);
            }
            console.log('Bilingual release gate passed on staged dist package.');
          }

          function parseVer(tag) {
            const m = String(tag || '').trim().match(/^v?(\d+)\.(\d+)\.(\d+)$/);
            return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
          }

          function cmpVer(a, b) {
            for (let i = 0; i < 3; i += 1) {
              if (a[i] !== b[i]) return a[i] - b[i];
            }
            return 0;
          }

          function resolveTagSha(repo, rel) {
            if (!rel) return '';
            const tag = rel.tag_name;
            try {
              const s = sh('git', ['rev-parse', `${tag}^{commit}`]);
              if (/^[0-9a-f]{40}$/.test(s)) return s;
            } catch {}
            try {
              const s = sh('gh', ['api', `repos/${repo}/commits/${tag}`, '--jq', '.sha']);
              if (/^[0-9a-f]{40}$/.test(s)) return s;
            } catch {}
            return '';
          }

          function shanghaiDate(date) {
            return new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Shanghai',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            }).format(date);
          }

          const repo = process.env.REPO;
          const event = process.env.EVENT_NAME;
          const refName = process.env.REF_NAME;
          const force = process.env.FORCE === 'true';

          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          requireCond(manifest.app === 'blockmd', "manifest.app must be 'blockmd'");
          const pluginId = String(manifest.id || '').trim();
          requireCond(/^[a-z0-9][a-z0-9-]{1,47}$/.test(pluginId), `invalid id: ${pluginId}`);
          const baseVer = String(manifest.version || '').trim();
          const mBase = baseVer.match(/^(\d+)\.(\d+)\.(\d+)$/);
          requireCond(Boolean(mBase), `manifest.version must be X.Y.Z, got ${baseVer}`);
          const baseMajor = Number(mBase[1]);
          const baseMinor = Number(mBase[2]);
          const pluginTitle = (manifest.name?.en || pluginId).trim();

          const headSha = sh('git', ['rev-parse', 'HEAD']);
          const rawRels = sh('gh', ['api', '--paginate', `repos/${repo}/releases?per_page=100`, '--jq', '.[]']);
          const releases = rawRels.split('\n').filter((l) => l.trim()).map((l) => JSON.parse(l));
          const stable = releases
            .filter((r) => !r.draft && !r.prerelease && parseVer(r.tag_name))
            .sort((a, b) => cmpVer(parseVer(a.tag_name), parseVer(b.tag_name)));
          const previous = stable.at(-1) || null;

          const takenMap = new Map();
          for (const r of releases) {
            const pv = parseVer(r.tag_name);
            if (pv) takenMap.set(pv.join('.'), pv);
          }
          for (const t of sh('git', ['tag', '--list', 'v*']).split('\n')) {
            const pv = parseVer(t);
            if (pv) takenMap.set(pv.join('.'), pv);
          }

          let version;
          let tag;
          let prevSha = '';

          if (event === 'push' && refName.startsWith('v')) {
            const pv = parseVer(refName);
            requireCond(Boolean(pv), `Tag ${refName} must match vX.Y.Z`);
            version = pv.join('.');
            tag = `v${version}`;
            const prevForNotes = [...stable].reverse().find((r) => r.tag_name !== tag) || null;
            prevSha = resolveTagSha(repo, prevForNotes);
          } else {
            if (event === 'schedule' && !force && previous?.published_at) {
              const today = shanghaiDate(new Date());
              const pubDay = shanghaiDate(new Date(previous.published_at));
              if (today === pubDay) {
                summary(`今日（${today}）已发布过 ${previous.tag_name}，每日定时最多自动发布一次，本次跳过。`);
                setOutput({ should_release: 'no' });
                process.exit(0);
              }
            }

            prevSha = resolveTagSha(repo, previous);
            if (prevSha && prevSha === headSha && !force) {
              summary(`当前 HEAD (${headSha.slice(0, 7)}) 与最新 Release ${previous.tag_name} 一致，跳过发版。`);
              setOutput({ should_release: 'no' });
              process.exit(0);
            }

            if (prevSha && !force && succeeds('git', ['merge-base', '--is-ancestor', prevSha, headSha])) {
              const changed = sh('git', ['diff', '--name-only', prevSha, headSha])
                .split('\n')
                .filter((p) => p && !p.startsWith('.github/') && p !== '.gitignore' && p !== 'LICENSE');
              if (changed.length === 0) {
                summary(`自 ${previous.tag_name} 以来仅包含 CI 或仓库元数据变更，无需发包，本次跳过。`);
                setOutput({ should_release: 'no' });
                process.exit(0);
              }
              const subjects = sh('git', ['log', '--no-merges', '--format=%s', `${prevSha}..${headSha}`])
                .split('\n')
                .filter((s) => s.length > 0);
              if (subjects.length > 0 && subjects.every((s) => s.toLowerCase().includes('[skip release]'))) {
                summary('区间内提交均标记 [skip release]，本次跳过。');
                setOutput({ should_release: 'no' });
                process.exit(0);
              }
            }

            const commitCount = Number(sh('git', ['rev-list', '--count', headSha]));
            let cand = [baseMajor, baseMinor, commitCount];
            let highest = null;
            for (const pv of takenMap.values()) {
              if (!highest || cmpVer(pv, highest) > 0) highest = pv;
            }
            if (highest && cmpVer(cand, highest) <= 0) {
              cand = [highest[0], highest[1], highest[2] + 1];
            }
            while (takenMap.has(cand.join('.'))) {
              cand = [cand[0], cand[1], cand[2] + 1];
            }
            version = cand.join('.');
            tag = `v${version}`;
          }

          const notesLines = [];
          if (prevSha && prevSha !== headSha && succeeds('git', ['merge-base', '--is-ancestor', prevSha, headSha])) {
            const rawLog = sh('git', ['log', '--no-merges', '--reverse', '--format=%h%x00%s', `${prevSha}..${headSha}`]);
            for (const line of rawLog.split('\n')) {
              if (!line.trim()) continue;
              const [cSha, subj] = line.split('\x00');
              if (/^(?:ci|docs)(?:\([^)]*\))?:\s/i.test(subj)) continue;
              notesLines.push(`- ${subj} (\`${cSha}\`)`);
            }
          }
          if (notesLines.length === 0) {
            notesLines.push(`- Automated release from \`${headSha.slice(0, 7)}\`.`);
          }
          fs.writeFileSync('release-notes.md', `## Changes\n\n${notesLines.join('\n')}\n`, 'utf8');

          const pkgDir = path.join('dist', pluginId);
          fs.rmSync('dist', { recursive: true, force: true });
          fs.mkdirSync(pkgDir, { recursive: true });
          const tarBytes = execFileSync('git', ['archive', '--format=tar', headSha]);
          execFileSync('tar', ['-xf', '-', '-C', pkgDir], { input: tarBytes });
          fs.rmSync(path.join(pkgDir, '.github'), { recursive: true, force: true });
          for (const metaFile of ['.gitignore']) {
            const p = path.join(pkgDir, metaFile);
            const st = fs.lstatSync(p, { throwIfNoEntry: false });
            if (st && !st.isSymbolicLink()) {
              fs.rmSync(p, { force: true });
            }
          }

          try {
            checkNoSymlinksTree(pkgDir);
          } catch (err) {
            console.error(`Bilingual release gate failed: ${err.message}`);
            process.exit(1);
          }

          manifest.version = version;
          fs.writeFileSync(path.join(pkgDir, 'manifest.json'), `${JSON.stringify(manifest, null, 2)}\n`, 'utf8');

          try {
            await validateStagedPackage(pkgDir);
          } catch (err) {
            console.error(`Bilingual release gate failed: ${err.message}`);
            process.exit(1);
          }

          const archiveName = `${pluginId}-${tag}.tar.gz`;
          execFileSync('tar', ['-czf', archiveName, '-C', 'dist', pluginId]);

          summary(`准备发布 ${pluginTitle} ${tag} (archive=${archiveName}, commit=${headSha.slice(0, 7)})`);
          setOutput({
            should_release: 'yes',
            version,
            tag,
            title: `${pluginTitle} ${version}`,
            archive: archiveName,
            head_sha: headSha,
          });
          NODE

      # 更新说明只经 tailnet 用 Magpie：Mac 在线先用 Mac 的 agy-cli/gemini-3.8-flash，再 VPS gpt-6-luna，最后 deepseek-flash。
      # 与 Block 主仓 scripts/release/release-notes.mjs 的顺序保持一致；不要用 Google AI Studio key。
      - name: Join tailnet
        id: tailscale
        if: steps.plan.outputs.should_release == 'yes'
        continue-on-error: true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-release-notes
          version: "1.104.4"
          ping: "100.115.90.80"
          timeout: 1m
          retry: "2"
          args: --shields-up

      - name: Write release notes with AI
        if: steps.plan.outputs.should_release == 'yes'
        env:
          TAILNET: ${{ steps.tailscale.outcome }}
        run: |
          reach() { timeout "$3" bash -c "echo >/dev/tcp/$1/$2" 2>/dev/null && echo yes || echo no; }
          if [ "$TAILNET" = "success" ]; then
            export MAGPIE_REACHABLE=$(reach 100.115.90.80 3425 10)
            export MAC_MAGPIE_REACHABLE=$(reach 100.118.27.43 3425 8)
          else
            export MAGPIE_REACHABLE=no MAC_MAGPIE_REACHABLE=no
          fi
          node .github/scripts/release-notes.mjs release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: steps.plan.outputs.should_release == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
          ARCHIVE: ${{ steps.plan.outputs.archive }}
          HEAD_SHA: ${{ steps.plan.outputs.head_sha }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md --draft=false --latest
            gh release upload "${TAG}" "${ARCHIVE}" --clobber
          else
            gh release create "${TAG}" "${ARCHIVE}" \
              --target "${HEAD_SHA}" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --latest
          fi
